<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบ Monitor CCTV กาญจนบุรี</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #000000;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 300px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand {
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
    }
    .search-box {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      outline: none;
    }
    .camera-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .cam-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.88rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .cam-item:hover { background-color: rgba(56, 189, 248, 0.15); }
    .cam-item.active {
      background-color: rgba(56, 189, 248, 0.25);
      border-left: 3px solid var(--accent);
    }
    .cam-item img {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      object-fit: cover;
      background: #000;
    }
    /* Main Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      padding: 10px 16px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    button, select, .file-label {
      background-color: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    button:hover, select:hover, .file-label:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    button.active-grid {
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }
    input[type="file"] { display: none; }
    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    /* Grid Container */
    .grid-container {
      flex: 1;
      padding: 10px;
      display: grid;
      gap: 10px;
      overflow-y: auto;
      background-color: var(--bg-dark);
    }
    .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .grid-4 { grid-template-columns: repeat(2, 1fr); grid-auto-rows: minmax(280px, 1fr); }
    .grid-9 { grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(220px, 1fr); }
    .grid-16 { grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(180px, 1fr); }

    .cam-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .cam-header {
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      border-bottom: 1px solid var(--border);
    }
    .cam-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }
    .cam-actions button {
      padding: 2px 6px;
      font-size: 0.75rem;
      margin-left: 4px;
    }
    .cam-body {
      flex: 1;
      position: relative;
      background: #000;
    }
    .cam-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: 220px; }
      .grid-4, .grid-9, .grid-16 { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <aside class="sidebar">

        <button onclick="toggleFullScreen()">⛶ เต็มจอ</button>

    let allCameras = [];
    let filteredCameras = [];
    let currentPage = 1;
    let gridSize = 4;

    // 1. เริ่มต้นโหลดไฟล์ cctv.m3u อัตโนมัติเมื่อเปิดหน้าเว็บ
    async function initMonitor() {
      try {
        const response = await fetch('cctv.m3u');
        if (!response.ok) throw new Error('ไม่สามารถโหลด cctv.m3u');
        const text = await response.text();
        parseM3U(text);
      } catch (err) {
        console.warn('ใช้ข้อมูลสำรองจากระบบ เนื่องจากเปิดผ่าน file:// หรือไม่พบไฟล์ cctv.m3u:', err);
        parseM3U(fallbackM3U);
      }
    }

    // 2. แปลงข้อมูล M3U เป็นรายการกล้อง
    function parseM3U(content) {
      const lines = content.split(/\r?\n/).map(l => l.trim()).filter(l => l !== '');
      const cameras = [];
      let currentCam = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('#EXTINF:')) {
          const idMatch = line.match(/tvg-id="([^"]*)"/);
          const logoMatch = line.match(/tvg-logo="([^"]*)"/);
          const groupMatch = line.match(/group-title="([^"]*)"/);
          const commaIndex = line.lastIndexOf(',');
          const name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Camera';

          currentCam = {
            id: idMatch ? idMatch[1] : `cam-${cameras.length + 1}`,
            logo: logoMatch ? logoMatch[1] : '',
            group: groupMatch ? groupMatch[1] : '',
            name: name,
            url: ''
          };
        } else if (!line.startsWith('#') && currentCam) {
          currentCam.url = line;
          cameras.push(currentCam);
          currentCam = null;
        }
      }

      allCameras = cameras;
      filteredCameras = [...allCameras];
      currentPage = 1;
      renderSidebar();
      renderGrid();
    }

    // 3. แสดงรายชื่อกล้องแถบซ้ายมือ
    function renderSidebar() {
      const listEl = document.getElementById('cameraList');
      listEl.innerHTML = '';

      filteredCameras.forEach((cam, index) => {
        const item = document.createElement('div');
        item.className = 'cam-item';
        item.innerHTML = `
          <img src="${cam.logo}" alt="logo" onerror="this.style.display='none'">
          <span>${cam.name}</span>
        `;
        item.onclick = () => focusSingleCamera(index);
        listEl.appendChild(item);
      });
    }

    // 4. แสดงหน้าจอกล้องตามจำนวน Grid และหน้าที่เลือก
    function renderGrid() {
      const gridEl = document.getElementById('gridContainer');
      gridEl.innerHTML = '';

      const totalPages = Math.max(1, Math.ceil(filteredCameras.length / gridSize));
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * gridSize;
      const pageCameras = filteredCameras.slice(startIndex, startIndex + gridSize);

      document.getElementById('pageInfo').textContent = `หน้า ${currentPage} / ${totalPages} (รวม ${filteredCameras.length} กล้อง)`;

      pageCameras.forEach((cam, idx) => {
        const frameId = `iframe-${startIndex + idx}`;
        const card = document.createElement('div');
        card.className = 'cam-card';
        card.innerHTML = `
          <div class="cam-header">
            <span class="cam-title" title="${cam.name}">🟢 ${cam.name}</span>
            <div class="cam-actions">
              <button onclick="reloadCam('${frameId}')" title="รีเฟรชกล้อง">↻</button>
              <button onclick="openCamWindow('${cam.url}')" title="เปิดแท็บใหม่">↗</button>
            </div>
          </div>
          <div class="cam-body">
            <iframe id="${frameId}" src="${cam.url}" allow="autoplay; fullscreen" loading="lazy"></iframe>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    // 5. ฟังก์ชันควบคุมหน้าจอและการเปลี่ยนหน้า
    function setGrid(size) {
      gridSize = size;
      currentPage = 1;
      const gridEl = document.getElementById('gridContainer');
      gridEl.className = `grid-container grid-${size}`;

      [1, 4, 9, 16].forEach(n => {
        document.getElementById(`btn-grid-${n}`).classList.toggle('active-grid', n === size);
      });
      renderGrid();
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderGrid();
      }
    }

    function nextPage() {
      const totalPages = Math.ceil(filteredCameras.length / gridSize);
      if (currentPage < totalPages) {
        currentPage++;
        renderGrid();
      }
    }

    function focusSingleCamera(index) {
      setGrid(1);
      currentPage = index + 1;
      renderGrid();
    }

    function reloadCam(iframeId) {
      const iframe = document.getElementById(iframeId);
      if (iframe) iframe.src = iframe.src;
    }

    function openCamWindow(url) {
      window.open(url, '_blank');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // 6. ค้นหากล้องแบบ Real-time
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase().trim();
      filteredCameras = allCameras.filter(c => c.name.toLowerCase().includes(keyword));
      currentPage = 1;
      renderSidebar();
      renderGrid();
    });

    // 7. รองรับการอัปโหลดไฟล์ .m3u ใหม่ด้วยตนเอง
    document.getElementById('m3uFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => parseM3U(event.target.result);
      reader.readAsText(file);
    });

    window.addEventListener('DOMContentLoaded', initMonitor);
